<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Transação</title>
</head>
<body>
    <h1>Adicionar Nova Transação</h1>
    <form action="/add" method="post">
        <p>Tipo:</p>
        <label>
            <input type="radio" name="type" value="receita" required> Receita
        </label>
        <label>
            <input type="radio" name="type" value="despesa" required> Despesa
        </label>
        <br><br>
        <label for="category">Categoria:</label>
        <input type="text" id="category" name="category" required>
        <br><br>
        <label for="amount">Valor (R$):</label>
        <input type="number" id="amount" name="amount" step="0.01" min="0" required>
        <br><br>
        <label for="date">Data:</label>
        <input type="date" id="date" name="date" required>
        <br><br>
        <label for="installments">Número de Parcelas (apenas para despesas):</label>
        <input type="number" id="installments" name="installments" min="1" value="1">
        <br><br>
        <button type="submit">Adicionar</button>
    </form>
    <br>
    <a href="/">Voltar para o Dashboard</a>
</body>
</html>
