<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Transação</title>
</head>
<body>
    <h1>Editar Transação</h1>
    <form method="post">
        <p>Tipo:</p>
        <label>
            <input type="radio" name="type" value="receita" {% if transaction.type == 'receita' %}checked{% endif %} required> Receita
        </label>
        <label>
            <input type="radio" name="type" value="despesa" {% if transaction.type == 'despesa' %}checked{% endif %} required> Despesa
        </label>
        <br><br>
        <label for="category">Categoria:</label>
        <input type="text" id="category" name="category" value="{{ transaction.category }}" required>
        <br><br>
        <label for="amount">Valor (R$):</label>
        <input type="number" id="amount" name="amount" value="{{ transaction.amount }}" step="0.01" min="0" required>
        <br><br>
        <label for="date">Data:</label>
        <input type="date" id="date" name="date" value="{{ transaction.date }}" required>
        <br><br>
        <button type="submit">Salvar Alterações</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}">Cancelar e Voltar para o Dashboard</a>
</body>
</html>
